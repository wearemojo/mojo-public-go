on:
  pull_request:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - run: go build -v ./...

    - run: go test -v ./...
